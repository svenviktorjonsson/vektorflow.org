<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171817">
  <title>Vektor Flow · live rigid rocks</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #171817; color: #f2f1ec; }
    body { min-height: 100dvh; display: grid; place-items: center; }
    main { width: min(100%, 1000px); padding: 10px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 2px 3px 10px; }
    h1 { margin: 0; font-size: clamp(18px, 4.8vw, 25px); }
    header span { color: #b8b5aa; font-size: 13px; }
    .stage { overflow: hidden; border: 1px solid #4b4c48; border-radius: 14px; background: #22231f; box-shadow: 0 20px 70px rgb(0 0 0 / .38); }
    .bar { min-height: 56px; display: flex; align-items: center; flex-wrap: wrap; gap: 9px; padding: 8px; border-bottom: 1px solid #4b4c48; background: #292a26; }
    button { min-height: 40px; border: 1px solid #6b6c66; border-radius: 9px; padding: 0 13px; color: inherit; background: #343530; font: inherit; font-weight: 680; }
    button[aria-pressed="true"] { color: #20211e; background: #e6e3d8; border-color: #e6e3d8; }
    label { display: flex; align-items: center; gap: 7px; color: #d0cec5; font-size: 13px; }
    input { accent-color: #d6cab1; }
    .status { margin-left: auto; color: #bbb9b0; font-size: 12px; }
    canvas { width: 100%; aspect-ratio: 5 / 3; display: block; background: #22231f; touch-action: none; cursor: grab; }
    canvas[data-dragging="true"] { cursor: grabbing; }
    footer { padding: 9px 3px 0; color: #aaa89e; font-size: 13px; }
    @media (max-width: 650px) { main { padding-left: 0; padding-right: 0; } header, footer { padding-left: 10px; padding-right: 10px; } .stage { border-left: 0; border-right: 0; border-radius: 0; } .status { width: 100%; margin-left: 2px; } canvas { aspect-ratio: 4 / 3; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Rigid rocks</h1><span>0.6.0 research</span></header>
    <section class="stage" aria-label="Interactive rigid rock simulation">
      <div class="bar">
        <button id="play" type="button" aria-pressed="true">Pause</button>
        <button id="reset" type="button">Reset</button>
        <label>Gravity <input id="gravity" type="range" min="0" max="15" value="9.82" step="0.1"></label>
        <span id="status" class="status" role="status">Building generated stones…</span>
      </div>
      <canvas id="rocks" width="900" height="540" aria-label="Generated rocks with rigid-body collision physics"></canvas>
    </section>
    <footer><strong>Pick up any rock, drag it, and drop it.</strong> The generated silhouettes use the rigid polygon solver with restitution, friction, angular inertia, sleeping, and rock-to-rock contacts.</footer>
  </main>
  <script type="module" src="./scene.mjs"></script>
</body>
</html>
