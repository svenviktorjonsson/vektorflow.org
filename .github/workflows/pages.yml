name: Publish generated site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Verify release selector and versioned pages
        run: node scripts/test-current-release-selector.mjs
      - name: Verify live preview invariants
        run: node scripts/test-live-preview-invariants.mjs
      - name: Verify compiled Coming Soon applications
        run: node scripts/test-compiled-previews.mjs
      - name: Verify read-only source and executable identity
        run: node scripts/test-preview-source-contract.mjs
      - name: Verify contact test page
        run: node scripts/test-contact-core-preview.mjs
      - name: Verify retained 0.6.0 previews
        shell: bash
        run: |
          test -f public/previews/0.6.0/test-generated-videos/water-surface/index.html
          test -f public/previews/0.6.0/test-generated-videos/water-surface/latest.mp4
          test -f public/previews/0.6.0/test-generated-videos/water-surface/latest.png
          test -f public/previews/0.6.0/live-gpu/water/index.html
          test -f public/previews/0.6.0/live-gpu/water/scene.mjs
          test -f public/previews/0.6.0/live-gpu/water/runtime/vf-liquid-particle-world-gpu.mjs
          test -f public/previews/0.6.0/live-gpu/water/runtime/vf-liquid-particle-embedding-gpu.mjs
          test -f public/previews/0.6.0/live-gpu/water/runtime/fixed-step-realtime-clock.mjs
          test -f public/previews/0.6.0/live-gpu/water/runtime/vf-physics-liquid-local-particle-reference.mjs
          test -f public/previews/0.6.0/live-gpu/water/runtime/vf-physics-transport-core-reference.mjs
          test -f public/previews/0.6.0/live-gpu/water/runtime/vf-water-2d-stone-channel-reference.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
